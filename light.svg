<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clip"><rect width="1200" height="600" rx="20"/></clipPath>
    <radialGradient id="space" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#0B1230"/>
      <stop offset="60%" stop-color="#050814"/>
      <stop offset="100%" stop-color="#020308"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="sweepGrad" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="600" fill="url(#space)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle cx="60" cy="40" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="90" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="220" cy="30" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="980" cy="50" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1060" cy="110" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="1140" cy="60" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="480" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="1120" cy="540" r="1" ><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="40" cy="520" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.8s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="560" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>

    <!-- radar sweep, top-right -->
    <g transform="translate(1050,80)" opacity="0.7">
      <circle r="150" fill="none" stroke="#5EEAD4" stroke-width="0.6" opacity="0.25"/>
      <circle r="100" fill="none" stroke="#5EEAD4" stroke-width="0.6" opacity="0.25"/>
      <circle r="50" fill="none" stroke="#5EEAD4" stroke-width="0.6" opacity="0.25"/>
      <g>
        <path d="M0,0 L150,0 A150,150 0 0,1 106,106 Z" fill="url(#sweepGrad)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- orbit ring around name area -->
    <g transform="translate(160,230)">
      <ellipse rx="330" ry="18" fill="none" stroke="#818CF8" stroke-width="1" opacity="0.35"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
        <circle cx="330" cy="0" r="4" fill="#5EEAD4" filter="url(#glow)"/>
      </g>
    </g>

    <!-- header strip -->
    <text x="60" y="52" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="3" fill="#7C89B8">MISSION LOG — DEV.MAITRI — ACTIVE</text>
    <circle cx="1128" cy="47" r="4" fill="#5EEAD4"><animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="1112" y="52" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="2" fill="#5EEAD4">ONLINE</text>

    <!-- name -->
    <text x="60" y="230" font-family="'Arial Black','Helvetica Neue',sans-serif" font-size="110" font-weight="900" letter-spacing="4" fill="url(#nameGrad)" filter="url(#glow)">MAITRI</text>

    <!-- typing subtitle -->
    <text x="63" y="270" font-family="'JetBrains Mono',monospace" font-size="18" font-weight="600" fill="#C7D2FE">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.00;0.03;0.22;0.25;1" dur="16s" repeatCount="indefinite"/>
      &gt; Full-Stack Developer
    </text>
    <text x="63" y="270" font-family="'JetBrains Mono',monospace" font-size="18" font-weight="600" fill="#C7D2FE">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.47;0.50;1" dur="16s" repeatCount="indefinite"/>
      &gt; AI &amp; ML Explorer
    </text>
    <text x="63" y="270" font-family="'JetBrains Mono',monospace" font-size="18" font-weight="600" fill="#C7D2FE">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.53;0.72;0.75;1" dur="16s" repeatCount="indefinite"/>
      &gt; Building Systems That Actually Matter
    </text>
    <text x="63" y="270" font-family="'JetBrains Mono',monospace" font-size="18" font-weight="600" fill="#C7D2FE">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.75;0.78;0.97;1.00;1" dur="16s" repeatCount="indefinite"/>
      &gt; Open to Internships &amp; Collaborations 🚀
    </text>
    <rect x="60" y="252" width="10" height="20" fill="#5EEAD4">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>

    <!-- tagline -->
    <text x="63" y="298" font-family="'Inter',sans-serif" font-size="13" fill="#7C89B8">B.Tech CSE '27 · shipped &amp; demoed to real institutions, not just built for GitHub stars</text>

    <!-- mission log cards -->
    <g font-family="'Inter',sans-serif">
      <rect x="60" y="340" width="340" height="98" rx="10" fill="#0E1530" stroke="#2A3363" stroke-width="1.2"/>
      <rect x="60" y="340" width="4" height="98" rx="2" fill="#5EEAD4"/>
      <text x="82" y="368" font-size="16" font-weight="700" fill="#F1F5F9">SwasthyaTrack</text>
      <text x="82" y="388" font-size="11.5" fill="#9AA6D4">Demoed to District &amp; Joint Commissioners, Nashik</text>
      <text x="82" y="406" font-size="10.5" font-family="'JetBrains Mono',monospace" fill="#5EEAD4">STATUS: DEPLOYED · SCALE-READY</text>

      <rect x="420" y="340" width="340" height="98" rx="10" fill="#0E1530" stroke="#2A3363" stroke-width="1.2"/>
      <rect x="420" y="340" width="4" height="98" rx="2" fill="#F472B6"/>
      <text x="442" y="368" font-size="16" font-weight="700" fill="#F1F5F9">OLAS</text>
      <text x="442" y="388" font-size="11.5" fill="#9AA6D4">Proctored exam platform · real-time monitoring</text>
      <text x="442" y="406" font-size="10.5" font-family="'JetBrains Mono',monospace" fill="#F472B6">STATUS: BEST PAPER — MIT IGTT 2026</text>

      <rect x="780" y="340" width="340" height="98" rx="10" fill="#0E1530" stroke="#2A3363" stroke-width="1.2"/>
      <rect x="780" y="340" width="4" height="98" rx="2" fill="#818CF8"/>
      <text x="802" y="368" font-size="16" font-weight="700" fill="#F1F5F9">ResumeScreenerAgent</text>
      <text x="802" y="388" font-size="11.5" fill="#9AA6D4">LangGraph · FAISS · Groq LLaMA 3 · FastAPI</text>
      <text x="802" y="406" font-size="10.5" font-family="'JetBrains Mono',monospace" fill="#818CF8">STATUS: AGENTIC PIPELINE · LIVE</text>
    </g>

    <!-- stack strip -->
    <text x="60" y="470" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="3" fill="#7C89B8">STACK</text>
    <g font-family="'JetBrains Mono',monospace" font-size="11" fill="#C7D2FE">
      <g transform="translate(60,482)"><rect width="66" height="24" rx="5" fill="none" stroke="#2A3363"/><text x="33" y="16" text-anchor="middle">Python</text></g>
      <g transform="translate(134,482)"><rect width="54" height="24" rx="5" fill="none" stroke="#2A3363"/><text x="27" y="16" text-anchor="middle">Java</text></g>
      <g transform="translate(196,482)"><rect width="60" height="24" rx="5" fill="none" stroke="#2A3363"/><text x="30" y="16" text-anchor="middle">React</text></g>
      <g transform="translate(264,482)"><rect width="90" height="24" rx="5" fill="none" stroke="#2A3363"/><text x="45" y="16" text-anchor="middle">TypeScript</text></g>
      <g transform="translate(362,482)"><rect width="76" height="24" rx="5" fill="none" stroke="#2A3363"/><text x="38" y="16" text-anchor="middle">Node.js</text></g>
      <g transform="translate(446,482)"><rect width="98" height="24" rx="5" fill="none" stroke="#2A3363"/><text x="49" y="16" text-anchor="middle">Spring Boot</text></g>
      <g transform="translate(552,482)"><rect width="96" height="24" rx="5" fill="none" stroke="#2A3363"/><text x="48" y="16" text-anchor="middle">PostgreSQL</text></g>
      <g transform="translate(656,482)"><rect width="86" height="24" rx="5" fill="none" stroke="#2A3363"/><text x="43" y="16" text-anchor="middle">MongoDB</text></g>
      <g transform="translate(750,482)"><rect width="70" height="24" rx="5" fill="none" stroke="#2A3363"/><text x="35" y="16" text-anchor="middle">Docker</text></g>
      <g transform="translate(828,482)"><rect width="96" height="24" rx="5" fill="none" stroke="#2A3363"/><text x="48" y="16" text-anchor="middle">TensorFlow</text></g>
    </g>

    <!-- footer -->
    <line x1="60" y1="530" x2="1140" y2="530" stroke="#2A3363" stroke-width="1"/>
    <text x="60" y="556" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7C89B8">github.com/memaitri</text>
    <text x="1140" y="556" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="11" fill="#7C89B8">"Build. Break. Learn. Repeat. Pray. Trust. &amp; Wait."</text>
  </g>

  <rect x="2" y="2" width="1196" height="596" rx="20" fill="none" stroke="#5EEAD4" stroke-width="1.4" stroke-dasharray="10 6" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;-320" dur="14s" repeatCount="indefinite"/>
  </rect>
</svg>
